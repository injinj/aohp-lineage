<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5">
  <title>LineageOS 23.2 + AOHP: what runs inside what</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .t { fill:#222; }
    .h { font-weight:600; font-size:16px; fill:#222; }
    .s { font-size:12px; fill:#555; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; fill:#222; }
    .lbl { font-size:11.5px; fill:#444; }
  </style>

  <!-- containers (background) -->
  <rect x="20" y="20" width="712" height="760" rx="14" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.5"/>
  <text x="40" y="46" class="h">Phone · Pixel 6 (oriole) or OnePlus 13 (dodge)</text>

  <rect x="40" y="60" width="672" height="705" rx="12" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5"/>
  <text x="80" y="86" class="h">LineageOS 23.2 (Android 16) + AOHP patches</text>
  <text x="80" y="104" class="s">this ROM · userdebug · SELinux enforcing · the only thing you flash</text>

  <rect x="80" y="420" width="532" height="290" rx="8" fill="#fdf3e1" stroke="#d08a1f" stroke-width="1.4"/>
  <text x="96" y="445" class="h">aohp-containerd  <tspan class="s" font-weight="400">root native daemon in /system/bin (system/core patch)</tspan></text>
  <text x="96" y="463" class="s">chroot container runtime + unit manager (systemd-subset units, ordering, restart policy, timers)</text>

  <rect x="100" y="478" width="492" height="218" rx="8" fill="#e8f5e9" stroke="#2e8b57" stroke-width="1.4"/>
  <text x="116" y="501" class="h">env “oc”  <tspan class="s" font-weight="400">Debian trixie chroot, /data/aohp/envs/oc · phone's network namespace</tspan></text>

  <!-- connectors -->
  <g fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M80,205 H58 V535 H116"/>
    <path d="M470,255 V298"/>
    <path d="M470,402 V418"/>
    <path d="M574,605 H650 V232 H614"/>
    <path d="M758,185 H614"/>
  </g>

  <!-- leaf nodes -->
  <rect x="80" y="130" width="240" height="125" rx="8" fill="#efe9fb" stroke="#7e5bc4" stroke-width="1.4"/>
  <text x="96" y="155" class="h">OpenClaw Android app</text>
  <text x="96" y="175" class="mono">ai.openclaw.app</text>
  <text x="96" y="197" class="t">Chat client. Talks only to the</text>
  <text x="96" y="215" class="t">gateway running on this phone.</text>
  <text x="96" y="238" class="s">/system/app, presigned</text>

  <rect x="340" y="130" width="272" height="125" rx="8" fill="#efe9fb" stroke="#7e5bc4" stroke-width="1.4"/>
  <text x="356" y="155" class="h">AOHP Driver app</text>
  <text x="356" y="175" class="mono">org.aohp.driver · platform-signed</text>
  <text x="356" y="197" class="t">Console: create / start envs, Units card,</text>
  <text x="356" y="215" class="t">Keystore secrets, Web tab = Control UI.</text>
  <text x="356" y="238" class="t">Runs the agent bridge; starts at boot.</text>

  <rect x="80" y="300" width="532" height="100" rx="8" fill="#e6f0fb" stroke="#3b78c2" stroke-width="1.4"/>
  <text x="96" y="323" class="h">Android framework (system_server) + AOHP services</text>
  <text x="96" y="343" class="mono">aohp_container · aohp_vault · aohp_virtual_display · aohp_agent_view</text>
  <text x="96" y="360" class="mono">aohp_event_stream · aohp_file_bridge · aohp_security_bridge</text>
  <text x="96" y="377" class="mono">aohp_ad · aohp_taint · …</text>
  <text x="96" y="393" class="s">frameworks/base patches · apps reach the container runtime only through these</text>

  <rect x="116" y="512" width="458" height="46" rx="6" fill="#c8e6c9" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="130" y="531" class="h" font-size="14.5">OpenClaw gateway · 127.0.0.1:18789</text>
  <text x="130" y="549" class="s">openclaw-gateway.service · Node 24 · starts at boot · model API via phone network</text>

  <rect x="116" y="582" width="458" height="46" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="130" y="601" class="t">aohp CLI (secrets, unit, timer) · watchdog timers</text>
  <text x="130" y="619" class="s">sshd, wg0 installed but off · units in /etc/aohp/system · systemctl shim</text>

  <rect x="116" y="642" width="458" height="40" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="130" y="659" class="t">workspace, skills, memory live on the container disk</text>
  <text x="130" y="676" class="s">API key lives in the Android Keystore, injected by the Driver — never on disk</text>

  <rect x="80" y="722" width="532" height="32" rx="6" fill="#e2e2e2" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="96" y="743" class="t">Linux kernel (stock Lineage) · cgroups · SELinux enforcing, aohp_* domains</text>

  <rect x="760" y="130" width="220" height="125" rx="8" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="776" y="155" class="h">Dev host (optional)</text>
  <text x="776" y="177" class="t">adb / fastboot / sideload</text>
  <text x="776" y="197" class="t">aohp CLI → bridge via</text>
  <text x="776" y="215" class="mono">adb forward tcp:6666</text>
  <text x="776" y="238" class="s">headless provisioning only</text>

  <!-- legend -->
  <g class="lbl">
    <rect x="760" y="560" width="14" height="14" fill="#efe9fb" stroke="#7e5bc4"/><text x="780" y="572">Android apps</text>
    <rect x="760" y="582" width="14" height="14" fill="#e6f0fb" stroke="#3b78c2"/><text x="780" y="594">Android framework (patched)</text>
    <rect x="760" y="604" width="14" height="14" fill="#fdf3e1" stroke="#d08a1f"/><text x="780" y="616">native daemon added by AOHP</text>
    <rect x="760" y="626" width="14" height="14" fill="#e8f5e9" stroke="#2e8b57"/><text x="780" y="638">Linux container (Debian)</text>
    <rect x="760" y="648" width="14" height="14" fill="#c8e6c9" stroke="#2e8b57"/><text x="780" y="660">the OpenClaw gateway</text>
    <text x="760" y="690" class="s">Arrows = who talks to whom.</text>
    <text x="760" y="706" class="s">All of it is loopback; nothing is</text>
    <text x="760" y="722" class="s">exposed off the phone by default.</text>
  </g>

  <!-- connector labels (on top) -->
  <g class="lbl">
    <text x="50" y="390" transform="rotate(-90 50,390)" text-anchor="middle">pairs over loopback 127.0.0.1:18789</text>
    <text x="480" y="283">Binder: aohp_container</text>
    <text x="480" y="414">unix socket</text>
    <text x="674" y="420" transform="rotate(-90 674,420)" text-anchor="middle">aohp CLI → agent bridge ws://127.0.0.1:6666 (JSON-RPC)</text>
    <text x="680" y="174" text-anchor="middle">adb forward tcp:6666</text>
  </g>
</svg>
